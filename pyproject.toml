[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signvision"
version = "2.0.0"
description = "ASL alphabet recognition: reproducible CNN baseline, controlled experiments, error analysis, robustness and interpretability"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
